[package]
name = "courier"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
cpal = "0.18.2"
crossbeam-channel = "0.5.17"
dirs = "7.0.0"
hound = "3.5.1"
libloading = "0.9.0"
mlua = { version = "0.12.2", features = ["lua54", "vendored", "serialize", "send"] }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
symphonia = { version = "0.6.1", features = ["mp3", "flac", "wav", "vorbis", "ogg", "pcm", "isomp4", "aac"] }
toml = "1.1.8"
ureq = "3.5.0"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_System_Shutdown", "Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
